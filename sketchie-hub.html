<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketchie site revamp: current build</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#0B0B0D;--panel:#131317;--ink:#F2F0EA;--body:rgba(242,240,234,.72);--faint:rgba(242,240,234,.56);
  --rule:rgba(242,240,234,.14);--accent:#D8FF3E;--accent-soft:rgba(216,255,62,.12);
  --sans:"Space Grotesk",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;
}
html[data-theme="day"]{
  --paper:#FBFBF9;--panel:#fff;--ink:#15161A;--body:#4A4F57;--faint:#5F656D;
  --rule:#E2E2DC;--accent:#0F6E5C;--accent-soft:#E6F2EE;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
.bar{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--rule);padding:12px clamp(16px,3vw,28px);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.bar .t{font-weight:700;letter-spacing:-.02em}
.bar .u{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.tabs a,.tabs button{
  font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;
  padding:8px 12px;border:1px solid var(--rule);border-radius:7px;background:var(--panel);
  color:var(--body);text-decoration:none;cursor:pointer;
}
.tabs a:hover,.tabs button:hover{border-color:var(--accent);color:var(--accent)}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:500}
.frame{width:100%;height:calc(100vh - 58px);border:0;display:block;background:var(--paper)}
.fallback{padding:clamp(20px,4vw,44px);max-width:760px}
.fallback h1{font-size:1.5rem;letter-spacing:-.02em;margin:0 0 10px}
.fallback p{color:var(--body);margin:0 0 14px}
.fallback ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.fallback a{color:var(--accent)}
@media (max-width:620px){
  .frame{height:calc(100vh - 96px)}
  .bar .u{display:none}
}
/* Hub chrome scrollbars. */
html{scrollbar-width:thin;scrollbar-color:var(--accent) var(--panel)}
::-webkit-scrollbar{width:13px;height:13px}
::-webkit-scrollbar-track{background:var(--panel)}
::-webkit-scrollbar-thumb{background:var(--accent);border:3px solid var(--panel);border-radius:99px}
::-webkit-scrollbar-corner{background:var(--panel)}
/* theme switch: a pill with a travelling knob */
.switch{position:relative;flex:0 0 auto;width:52px;height:28px;padding:0;border-radius:999px;cursor:pointer;
  background:var(--panel);border:1px solid var(--rule);
  transition:background-color .25s ease,border-color .25s ease}
.switch .knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:var(--faint);
  transition:transform .28s cubic-bezier(.2,.8,.3,1),background-color .25s ease}
.switch[aria-checked="true"]{background:var(--accent-soft);border-color:var(--accent)}
.switch[aria-checked="true"] .knob{transform:translateX(24px);background:var(--accent)}
.switch:hover{border-color:var(--accent)}
.switch:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.switch,.switch .knob{transition:none}}
.tabs .switch{border-radius:999px;padding:0}
.aside{display:flex;align-items:center;gap:6px;flex-wrap:wrap;width:100%;padding-top:4px;border-top:1px solid var(--rule);margin-top:2px}
.aside .lbl{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.aside button{font-family:var(--mono);font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;
  border:1px dashed var(--rule);border-radius:6px;background:transparent;color:var(--faint);cursor:pointer}
.aside button:hover{border-style:solid;border-color:var(--accent);color:var(--accent)}
.aside button.on{border-style:solid;border-color:var(--accent);color:var(--accent)}
</style>
<script>
(function(){var KEY="sketchie-hub-theme";var saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}document.documentElement.setAttribute("data-theme",saved||"day");})();
</script>
</head>
<body>

<div class="bar">
  <span class="t">Sketchie site revamp</span>
  <span class="u" id="stamp">Revamping the existing site · their palette · 2026-10-16</span>
  <nav class="tabs" aria-label="Views">
    <button type="button" data-src="sketchie-concept-b-paper.html" class="on">Revamp</button>
    <button type="button" data-src="sketchie-brand-case.html">The case</button>
    <button type="button" data-src="sketchie-sitemap-report.html">Structure</button>
    <button class="switch" type="button" id="themeToggle" role="switch" aria-checked="false" aria-label="Night mode"><span class="knob"></span></button>
    <a id="open" href="sketchie-concept-b-paper.html">Open full</a>
  </nav>
  <nav class="aside" aria-label="Set aside">
    <span class="lbl">Set aside</span>
    <button type="button" data-src="sketchie-concept-c.html">Neon rebrand</button>
  </nav>
</div>

<iframe class="frame" id="frame" src="sketchie-concept-b-paper.html" title="Sketchie site revamp"></iframe>

<noscript>
  <div class="fallback">
    <h1>Sketchie site revamp</h1>
    <p>Open any of these directly:</p>
    <ul>
      <li><a href="sketchie-concept-b-paper.html">The revamp</a></li>
      <li><a href="sketchie-sitemap-report.html">Structure and site map</a></li>
      <li><a href="sketchie-concept-c.html">Set aside: neon rebrand</a></li>
      <li><a href="sketchie-brand-case.html">The case for revamping</a></li>
    </ul>
  </div>
</noscript>

<script>
(function(){
  /* the hub chrome owns its own theme and does not touch the page it frames */
  var KEY="sketchie-hub-theme";var root=document.documentElement;
  function theme(){return root.getAttribute("data-theme")||"day"}
  var frame=document.getElementById("frame");
  var open=document.getElementById("open");
  // only buttons that name a view are tabs; the theme switch is not one
  var btns=[].slice.call(document.querySelectorAll("button[data-src]"));
  function withTheme(src){return src}
  function show(src,btn){
    if(!src){return}
    frame.src=withTheme(src);
    open.href=withTheme(src);
    btns.forEach(function(b){b.classList.toggle("on",b===btn)});
    try{history.replaceState(null,"","#"+src.replace(".html",""))}catch(e){}
  }
  btns.forEach(function(b){
    b.addEventListener("click",function(){show(b.getAttribute("data-src"),b)});
  });
  var tbtn=document.getElementById("themeToggle");
  function paint(){var night=theme()==="night";tbtn.setAttribute("aria-checked",String(night));tbtn.setAttribute("aria-label",night?"Night mode on":"Night mode off")}
  function setTheme(m){
    root.setAttribute("data-theme",m);
    try{localStorage.setItem(KEY,m)}catch(e){}
    paint();

  }
  paint();
  tbtn.addEventListener("click",function(){setTheme(theme()==="day"?"night":"day")});

  // deep link support: #sketchie-brand-case opens that view
  var h=location.hash.replace("#","");
  if(h){
    var match=btns.filter(function(b){return b.getAttribute("data-src").indexOf(h)===0})[0];
    if(match){show(match.getAttribute("data-src"),match)}
  }
})();
</script>
</body>
</html>
